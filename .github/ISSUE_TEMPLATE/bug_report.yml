name: Bug report
description: Something behaves differently from what it says it does
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Two things make a diagnosis-tool bug reproducible, and both are easy to
        leave out: the **model** and the **tool calls**. The same question can
        take a different chain on the next run, so the trace matters more than
        the wording of the answer.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the answer and the tool calls printed to stderr.
      placeholder: |
        $ python agent.py "why is web failing in prod?"
          -> list_pods({'namespace': 'prod', 'only_unhealthy': True})
          -> describe_pod(...)
        <the answer, and its [grounded]/[partial] line>
    validations: {required: true}
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations: {required: true}
  - type: input
    id: model
    attributes:
      label: Model
      description: TRIAGE_MODEL, and `ollama show <model>` capabilities if unusual.
      placeholder: qwen3
    validations: {required: true}
  - type: dropdown
    id: surface
    attributes:
      label: Which surface
      options: [CLI, --scan, REST API, MCP server, browser UI, controller, other]
    validations: {required: true}
  - type: input
    id: cluster
    attributes:
      label: Cluster
      description: kind, EKS, GKE, AKS, k3s… and the Kubernetes version.
      placeholder: kind, v1.31
  - type: textarea
    id: anything
    attributes:
      label: Anything else
      description: |
        If the answer contained a figure that was wrong, say which one — a
        fabricated number that reads as grounded is the most interesting bug
        this project has.
