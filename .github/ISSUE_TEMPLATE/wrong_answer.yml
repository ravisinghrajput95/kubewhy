name: Wrong diagnosis
description: The tool ran fine and reached the wrong conclusion
labels: [wrong-answer]
body:
  - type: markdown
    attributes:
      value: |
        This is a different report from a bug, and more useful. The code can be
        correct while the agent is wrong, which is what `evals/` exists to
        measure — a good report here often becomes a new eval case.
  - type: textarea
    id: question
    attributes:
      label: The question you asked
    validations: {required: true}
  - type: textarea
    id: answer
    attributes:
      label: The answer, with its tool calls and confidence line
      description: The trace is the evidence. Without it there is nothing to check.
    validations: {required: true}
  - type: textarea
    id: truth
    attributes:
      label: What was actually wrong with the cluster
      description: And how you knew — `kubectl` output is ideal.
    validations: {required: true}
  - type: dropdown
    id: confidence
    attributes:
      label: What confidence did it report
      options: [grounded, partial, ungrounded, "no confidence line shown"]
    validations: {required: true}
  - type: markdown
    attributes:
      value: |
        A wrong answer marked **grounded** is the highest-severity report this
        project takes: it means the checker confirmed claims that were not
        true, and that is a hole in the verification rather than in the model.
