name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. v0.1.1"
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          [ -n "$VERSION" ] || VERSION="${GITHUB_REF#refs/tags/}"
          echo "raw=$VERSION" >> "$GITHUB_OUTPUT"
          echo "number=${VERSION#v}" >> "$GITHUB_OUTPUT"

      # Clusters are overwhelmingly amd64; this is likely built on arm64
      # hardware. Publishing one architecture means the chart installs on the
      # maintainer's laptop and nowhere else.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.version.outputs.number }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.number }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the published image runs
        # A tag that publishes a broken image is worse than no tag. Pull the
        # amd64 manifest back and check the service actually serves.
        run: |
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.version.outputs.number }}"
          docker run -d --name verify --platform linux/amd64 -p 8000:8000 "$IMG"
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/healthz > /dev/null; then
              echo "published image serves /healthz"
              docker rm -f verify
              exit 0
            fi
            sleep 2
          done
          echo "published image did not come up"
          docker logs verify
          exit 1

  chart:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          [ -n "$VERSION" ] || VERSION="${GITHUB_REF#refs/tags/}"
          echo "number=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Lint
        run: helm lint deploy/chart

      - name: Package and push
        # Chart and appVersion are driven by the tag, so a chart can never
        # claim to deploy a version of the image that was not built.
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ${{ env.REGISTRY }} \
              --username ${{ github.actor }} --password-stdin

          helm package deploy/chart \
            --version "${{ steps.version.outputs.number }}" \
            --app-version "${{ steps.version.outputs.number }}"

          helm push "kubewhy-${{ steps.version.outputs.number }}.tgz" \
            "oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts"
