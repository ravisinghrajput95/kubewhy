name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly. The replay needs no model and no cluster, so it costs a runner
    # minute -- and the failure it catches is a dependency moving underneath
    # the checker, which no push would trigger.
    - cron: "0 6 * * 1"

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      # Report every failing version, rather than stopping at the first.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    services:
      # The shared-state path exists so two replicas can use one store, and a
      # stub cannot demonstrate that -- the lease is a race between processes
      # and the dedup budget is a row two of them write. So CI runs a real
      # server. Without this the Postgres cases skip, and a skipped case
      # reports the same green as a passing one.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: kubewhy
          POSTGRES_DB: kubewhy
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # The suite mocks the Kubernetes API and ollama.chat, so no cluster
        # and no model are needed here. Postgres is the exception and is a
        # real one, for the reason in `services` above.
        env:
          TRIAGE_TEST_PG_DSN: postgresql://postgres:kubewhy@localhost:5432/kubewhy
        run: |
          pytest
          # A skipped Postgres case is indistinguishable from a passing one in
          # the dot output, and the whole point of the service container is
          # that these run. Fail the job if they did not.
          pytest tests/test_store.py -o addopts= -q -rs 2>&1 | tee /tmp/store.txt
          if grep -q "no Postgres to test against" /tmp/store.txt; then
            echo "::error::the Postgres store cases skipped; the service container did not come up"
            exit 1
          fi

  ui:
    # Separate job on one version, because the UI extra pulls numpy, pandas,
    # pyarrow and friends. Installing that in the matrix above would make every
    # run pay for it, which is exactly what requirements-ui.txt exists to
    # avoid. Without this job the UI tests skip everywhere and test nothing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ui.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-ui.txt
          pip install pytest

      - name: Run UI tests
        # Fails rather than skips if streamlit is somehow absent, since a
        # silently skipped suite is the failure this job exists to prevent.
        run: |
          python -c "import streamlit"
          pytest tests/test_ui.py

  replay:
    # Continuous, not once per release. This project's rule is to replay the
    # recorded corpus before believing ANY change to grounding, contradiction
    # detection or the grader -- a rule it earned twice, once when the first
    # contradiction rules produced six false positives and zero true ones, and
    # once when the first absence rule called nine correct answers
    # contradicted. Both were caught by replaying and would have shipped
    # otherwise.
    #
    # Needs no cluster and no model: it re-scores answers that were already
    # recorded, which is the whole point of retaining draft and evidence.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history. The gate below diffs against the base branch, and
          # the default shallow clone has no origin/<base> to diff against --
          # the step would fail on a missing ref rather than on a moved
          # verdict, which is the confusing way for a gate to break.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Prove the harness reaches the checker
        # First, and separately. A replay wired to nothing reports "no
        # regressions" and looks exactly like a clean run, so the harness has
        # to demonstrate it detects a deliberate perturbation before its
        # verdict on the real corpus means anything.
        run: python evals/replay_grounding.py --self-check

      - name: Replay the recorded corpus
        # Reports transitions without failing: seeing what a change did is the
        # common use, and failing by default would make the tool useless for
        # it. The gate below is what fails.
        run: python evals/replay_grounding.py --json replay.json

      - name: Fail if a verdict moved unexpectedly
        # Only on pull requests that touch the checker. On main the corpus and
        # the code move together and a transition is usually the intended
        # effect of the commit being merged.
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD \
             | grep -qE '^(grounding|contradiction)\.py$'; then
            echo "the checker changed in this PR -- verdict moves must be deliberate"
            python evals/replay_grounding.py --fail-on-change
          else
            echo "checker unchanged; transitions are informational"
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: grounding-replay
          path: replay.json

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        # --target base, explicitly. Without it docker builds the LAST stage in
        # the Dockerfile, which became the ui stage the moment that was added
        # below base -- so this job silently started building Streamlit and
        # then curling port 8000 for an API that was never in the image.
        # Streamlit is not what this job tests; the ui job above covers it.
        run: docker build --target base -t kubewhy:ci .

      - name: Check the service starts and serves
        # Guards the container entrypoint, which the pytest job never touches.
        run: |
          docker run -d --name ci-check -p 8000:8000 kubewhy:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/platform > /dev/null; then
              echo "service is up"
              exit 0
            fi
            sleep 2
          done
          echo "service did not come up in time"
          docker logs ci-check
          exit 1
