# Streamlit defaults are wrong for this project in two ways that matter.
#
# gatherUsageStats defaults to true: Streamlit reports usage back to
# streamlit.io. This project's entire claim is that nothing leaves your
# network, so that default has to be off before the UI is worth shipping.
#
# server.address defaults to unset, which listens on every interface. Streamlit
# has no authentication of any kind, and this UI renders cluster state and pod
# logs, so an unset address is an unauthenticated cluster viewer on your LAN.
# Loopback is the only safe default; the REST API is bound the same way and for
# the same reason.

[server]
address = "127.0.0.1"
headless = true

[browser]
gatherUsageStats = false
