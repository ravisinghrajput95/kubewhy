apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
# Exits immediately with a non-zero code -> CrashLoopBackOff
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crasher
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: crasher }
  template:
    metadata:
      labels: { app: crasher }
    spec:
      containers:
        - name: crasher
          image: busybox:1.36
          command: ["sh", "-c", "echo 'connecting to database...'; sleep 2; echo 'FATAL: could not connect to db:5432: connection refused' >&2; exit 1"]
---
# Allocates far more than its limit -> OOMKilled
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-hog
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: memory-hog }
  template:
    metadata:
      labels: { app: memory-hog }
    spec:
      containers:
        - name: hog
          image: polinux/stress
          command: ["stress"]
          args: ["--vm", "1", "--vm-bytes", "250M", "--vm-hang", "0"]
          resources:
            requests: { memory: "32Mi", cpu: "50m" }
            limits: { memory: "64Mi", cpu: "100m" }
---
# References an image that does not exist -> ImagePullBackOff
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-image
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: bad-image }
  template:
    metadata:
      labels: { app: bad-image }
    spec:
      containers:
        - name: bad-image
          image: nginx:this-tag-does-not-exist
---
# Backed by pods that never become ready -> a service with zero ready
# endpoints, which is reachable in name only.
apiVersion: v1
kind: Service
metadata:
  name: crasher-svc
  namespace: demo
spec:
  selector: { app: crasher }
  ports:
    - port: 80
      targetPort: 8080
---
# The other classic: a selector that matches nothing at all, usually a typo.
apiVersion: v1
kind: Service
metadata:
  name: typo-svc
  namespace: demo
spec:
  selector: { app: web-frontend }
  ports:
    - port: 80
      targetPort: 8080
---
# A healthy service, as a control
apiVersion: v1
kind: Service
metadata:
  name: healthy-web
  namespace: demo
spec:
  selector: { app: healthy-web }
  ports:
    - port: 80
      targetPort: 80
---
# A healthy control, so not everything is broken
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthy-web
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels: { app: healthy-web }
  template:
    metadata:
      labels: { app: healthy-web }
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          resources:
            requests: { memory: "32Mi", cpu: "50m" }
            limits: { memory: "128Mi", cpu: "200m" }
---
# Everything below exists because a cluster of five Deployments hid real bugs.
# Each shape here broke the agent in a way the Deployments above could not:
# completed Jobs were reported as failures, init container failures were
# invisible, CronJob runs each counted as a new workload, static pods grouped
# under their node, and sidecars made log reads fail outright.
#
# A CronJob that succeeds. Its finished pods must NOT be reported as broken --
# on a real cluster these are most of the non-Running pods.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup
  namespace: demo
spec:
  schedule: "*/1 * * * *"
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: busybox:1.36
              command: ["/bin/sh", "-c", "echo backup complete"]
---
# A CronJob that fails every run. Must be ONE finding named "nightly-sync",
# not a new workload per scheduled run.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-sync
  namespace: demo
spec:
  # Every five minutes, keeping six failures, rather than every minute keeping
  # two. Both numbers are about determinism, not about the fault.
  #
  # At one run per minute with two retained, a failed pod lives ~2 minutes --
  # shorter than a local-model investigation, which is 72s at the median and
  # was measured at 247s at the maximum. The eval scenario would be told a pod
  # name by scan_cluster and find it deleted by the time describe_pod ran, and
  # the answer became "the pod no longer exists" rather than the diagnosis.
  # A scenario whose ground truth evaporates mid-run is not reproducible.
  #
  # Six retained at one run per five minutes is ~30 minutes of life, against a
  # 4-minute worst-case investigation: roughly 7x margin.
  schedule: "*/5 * * * *"
  failedJobsHistoryLimit: 6
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: sync
              image: busybox:1.36
              command: ["/bin/sh", "-c", "echo 'FATAL: upstream returned 503'; exit 1"]
---
# An init container waiting on a dependency that never arrives. Reports phase
# Pending with no app container status, so it used to read as "Pending" and the
# controller ignored it entirely.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: needs-db
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: needs-db}
  template:
    metadata:
      labels: {app: needs-db}
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ["/bin/sh", "-c", "echo 'cannot resolve postgres.data.svc'; exit 1"]
      containers:
        - name: app
          image: busybox:1.36
          command: ["/bin/sh", "-c", "while true; do sleep 3600; done"]
---
# A node-scoped workload, so DaemonSet ownership is exercised.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-shipper
  namespace: demo
spec:
  selector:
    matchLabels: {app: log-shipper}
  template:
    metadata:
      labels: {app: log-shipper}
    spec:
      containers:
        - name: shipper
          image: busybox:1.36
          command: ["/bin/sh", "-c", "echo 'no sink configured'; exit 2"]
---
# Two containers, as anything behind a service mesh has. The API refuses to
# guess which one's logs you want, so this pod made get_pod_logs fail outright.
# The application is the interesting one; the proxy is noise.
apiVersion: v1
kind: Pod
metadata:
  name: sidecar-app
  namespace: demo
  labels: {app: sidecar-app}
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["/bin/sh", "-c", "echo 'APP: connection refused to db:5432'; while true; do sleep 3600; done"]
    - name: istio-proxy
      image: busybox:1.36
      command: ["/bin/sh", "-c", "echo 'PROXY: ready'; while true; do sleep 3600; done"]
---
# Running, and broken. Every other failure here announces itself in the pod
# status; this one does not. The container starts fine, stays up, and never
# passes its readiness probe, so the pod sits at 0/1 Ready with phase Running,
# no restarts, no termination reason and no warning that a status-only view
# would show. It is removed from its Service's endpoints and receives nothing.
#
# The loop is what makes "no restarts" true, and it was `sleep 3600` until
# 2026-08-28. That exits 0 after an hour and the kubelet restarts it, so on
# any cluster left up longer than that the pod acquires a restart count and a
# last termination of exit code 0 -- which is precisely the wrong evidence for
# the one case in the suite whose premise is that nothing here ever crashed.
# It showed up in the answers: results/final-29-qwen3-n5.json has a run citing
# `restarts: 4` and diagnosing "the container exits with exit code 0,
# triggering restarts", against a fixture whose whole point is that it does
# not. The pod was four hours old and the number was real.
#
# Swept across every fixture on the same day, 21 containers in four files.
# Only this case asserts on restarts, but the artefact was never confined to
# it: a long-lived demo cluster handed every "healthy" pod a restart count and
# an exit code 0, which is misleading evidence in any scenario that reads one.
#
# What the sweep costs is worth stating. Cluster state that every published
# number in VALIDATION.md was measured against has changed, in the direction
# of removing an artefact rather than adding one -- so a future run is
# comparable to those numbers only for pods whose restart count was zero
# anyway, which on a freshly applied cluster is all of them.
#
# Containers meant to exit are untouched: `exit 1`, `exit 2`, the `stress`
# hog and the two CronJobs still do exactly what they did.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: never-ready
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: never-ready}
  template:
    metadata:
      labels: {app: never-ready}
    spec:
      containers:
        - name: web
          image: busybox:1.36
          command: ["/bin/sh", "-c",
                    "echo 'listening on :8080'; while true; do sleep 3600; done"]
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
---
# The probe as the fault rather than the symptom. This container needs 60s to
# start; the liveness probe gives it 5s plus three 5-second failures, so it is
# killed at ~20s, forever. The status says CrashLoopBackOff, which reads as an
# application crash -- the app never got the chance to run. Only the probe's
# own numbers distinguish the two, which is why the projection carries them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slow-starter
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: slow-starter}
  template:
    metadata:
      labels: {app: slow-starter}
    spec:
      containers:
        - name: web
          image: busybox:1.36
          command: ["/bin/sh", "-c", "sleep 60; echo 'ready at last'; while true; do sleep 3600; done"]
          livenessProbe:
            tcpSocket: {port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
