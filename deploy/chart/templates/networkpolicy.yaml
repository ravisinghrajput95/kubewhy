{{- if .Values.networkPolicy.enabled }}
{{- /*
Egress restriction, enforced by the dataplane rather than promised by the code.

inference.py refuses to send evidence off-network unless allowExternal is set.
This is the same claim made where a bug in that code cannot undo it -- the same
argument rbac.yaml makes about the tools being read-only: better a property the
platform enforces than a promise the process keeps.

**Two honest caveats, and they are why this is off by default.**

It needs a CNI that actually enforces NetworkPolicy. Several managed offerings
ship one that silently ignores these objects unless a dataplane option was
chosen when the cluster was created, and a policy that is quietly not enforced
is worse than none: it is a control someone will point at in a review.

**Enforcement verified 2026-08-23 on kind v1.36.1 with the default kindnet
CNI**, against a control pod so that the block is attributable to the policy
rather than to the environment: a pod carrying the selector labels could not
open TCP to 1.1.1.1:443 or 8.8.8.8:443, an unlabelled pod in the same namespace
reached both, and the labelled pod still reached an in-cluster Service, the API
server ClusterIP and DNS. That is one CNI. GKE, EKS and AKS dataplanes are
NOT tested, and each is a different implementation -- verify it does what you
think before you rely on it: exec into the pod and try to reach something
public, with an unlabelled pod alongside as the control.

**What it permits.** DNS, so Service names resolve. Private address space, so
the API server, an in-cluster model and an on-network one are all reachable.
Nothing else -- which is the point.

**It also selects the console pod, which collides with ui.auth.enabled.** The
selector here is the chart's name and instance, and the console carries both,
so the oauth2-proxy sidecar is inside this policy. An identity provider on
your network is fine. A SaaS one -- Okta, Entra, Google -- is not reachable,
and the symptom is the proxy failing OIDC discovery at startup rather than
anything that names a NetworkPolicy. extraAllowedCIDRs is the escape hatch and
is a poor one for a provider behind a CDN, where the address set is neither
small nor stable. Either run the provider on-network, or accept that these two
options are mutually exclusive for now and say which one you chose.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-egress
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: ["Egress"]
  egress:
    # DNS first, and to anywhere rather than to a labelled kube-dns pod. The
    # label differs between distributions -- k8s-app=kube-dns on most,
    # something else on others -- and a policy that names the wrong one breaks
    # every lookup the agent makes, which presents as the API server being
    # unreachable rather than as a DNS problem.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        # RFC1918 and the link-local range. The API server, in-cluster
        # Services, pod IPs and an on-network model all live here; the public
        # internet does not.
        - ipBlock:
            cidr: 10.0.0.0/8
        - ipBlock:
            cidr: 172.16.0.0/12
        - ipBlock:
            cidr: 192.168.0.0/16
        - ipBlock:
            # 169.254.0.0/16 covers the metadata endpoint every managed
            # platform serves at 169.254.169.254. It is in because a
            # ServiceAccount token projection needs no network at all, but the
            # cloud SDKs a base image carries will try this address and hang
            # for their full timeout if it blackholes rather than refuses.
            cidr: 169.254.0.0/16
      {{- range .Values.networkPolicy.extraAllowedCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
      {{- end }}
{{- end }}
