{{- if .Values.ollama.enabled }}
{{- /*
Optional in-cluster Ollama.

Off by default, and that default is deliberate. `model.ollamaHost` has always
pointed at a service this chart did not create, because most clusters that run
a local model already have one -- on a GPU node, behind a gateway, or shared
between teams -- and quietly standing up a second copy would waste a node's
worth of memory. Turning this on is a decision to let the chart own the model
server too.

Validated on GKE 2026-08-22: llama3.2 served from this Deployment, reached at
ollama.ollama.svc.cluster.local:11434, answering a real diagnosis end to end.
The model was resident in the cluster and absent from the workstation, so the
inference provably happened here.
*/}}
{{- $ns := .Values.ollama.namespace | default .Release.Namespace }}
{{- if ne $ns .Release.Namespace }}
{{- /*
Create the namespace when it is not the release's own.

Helm's --create-namespace only creates the namespace the release installs
into, so a chart that renders objects somewhere else has to create that
somewhere else itself. Found by installing rather than by templating:
`ollama.enabled=true` with `ollama.namespace=ollama` failed the whole release
with "namespaces \"ollama\" not found", and `helm template` had rendered it
without complaint.

Deliberately not helm.sh/hook: a hook-created namespace is not tracked by the
release and would outlive `helm uninstall`, which is the leftover-resource
problem this project has already paid for once today with an orphaned disk.
*/}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.ollama.name }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: {{ .Values.ollama.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: model
spec:
  selector:
    app.kubernetes.io/name: {{ .Values.ollama.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: {{ .Values.ollama.port }}
      targetPort: {{ .Values.ollama.port }}
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.ollama.name }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: {{ .Values.ollama.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: model
spec:
  replicas: 1
  {{- /* One replica, and Recreate rather than RollingUpdate: two pods would
         each pull the model and each hold it in memory, which on the node
         sizes people use for this is enough to make neither schedulable. */}}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.ollama.name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.ollama.name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: model
    spec:
      {{- with .Values.ollama.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ollama.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ollama
          image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
          imagePullPolicy: {{ .Values.ollama.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.ollama.port }}
              name: http
          env:
            {{- /* Ollama binds loopback by default, which a Service cannot
                   reach. The symptom is a pod that never passes its readiness
                   probe, which reads as a slow model rather than as a bind
                   address. */}}
            - name: OLLAMA_HOST
              value: "0.0.0.0:{{ .Values.ollama.port }}"
            - name: OLLAMA_KEEP_ALIVE
              value: {{ .Values.ollama.keepAlive | quote }}
            {{- with .Values.ollama.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.ollama.resources | nindent 12 }}
          {{- if .Values.ollama.pullModelOnStart }}
          {{- /*
          Ready means "can answer", not "is listening".

          Measured on a fresh kind cluster 2026-08-23: with an HTTP readiness
          probe this pod reported 1/1 Ready holding no model at all, and every
          diagnosis came back `model not found (status code: 404)`. Nothing in
          `kubectl get pods`, `kubectl describe` or the events said so -- the
          only evidence anywhere in the cluster was a 404 line in Ollama's own
          access log.

          A model listed is the weakest check that distinguishes those two
          states. It costs a process exec every 15s, which is nothing next to
          a deployment that looks healthy and cannot answer.
          */}}
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - ollama list | grep -q '^{{ .Values.model.name }}'
            {{- /* The first window has to cover a model download: 2GB for a
                   small model, 5GB+ for a useful one, over whatever link the
                   node has. 40 x 15s is ten minutes, and a pod still pulling
                   is correctly NotReady for all of it. */}}
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 40
          {{- else }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.ollama.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
          {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.ollama.port }}
            {{- /* Generous: a cold model load blocks the HTTP handler, and a
                   liveness probe that fires during it restarts the pod
                   forever without ever serving a request. */}}
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          {{- if .Values.ollama.pullModelOnStart }}
          {{- /*
          Wait for the server, then pull, and keep trying.

          The previous version was `ollama pull <model> || true`, and postStart
          runs concurrently with the container's main process -- so the CLI
          reached a server that was not listening yet, failed in under a
          second, and `|| true` swallowed it. The pod then ran forever with no
          model. Found by installing this chart on a fresh cluster; `helm
          template` renders the broken version and the working one identically.

          It is a race rather than a certain failure, which is worse: it
          resolved in this project's favour on GKE in August and against it on
          kind, so the chart was recorded as validated.

          `|| true` stays at the end on purpose. A postStart hook that exits
          non-zero has the kubelet kill the container, so a transient registry
          blip would become a CrashLoopBackOff. The retry loop is what makes
          the failure rare; the readiness probe above is what makes it visible
          when it happens anyway, which is the half that was missing.
          */}}
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    for i in $(seq 1 60); do
                      ollama list >/dev/null 2>&1 && break
                      sleep 2
                    done
                    for i in $(seq 1 5); do
                      ollama pull {{ .Values.model.name }} && exit 0
                      sleep 5
                    done
                    true
          {{- end }}
      volumes:
        - name: models
          {{- if .Values.ollama.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.ollama.name }}-models
          {{- else }}
          {{- /* emptyDir means the model is re-pulled whenever the pod moves.
                 Fine for a test cluster, expensive on a 5GB model in
                 production -- which is why persistence defaults to on. */}}
          emptyDir: {}
          {{- end }}
{{- if .Values.ollama.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.ollama.name }}-models
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: {{ .Values.ollama.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: model
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.ollama.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.ollama.persistence.size }}
{{- end }}
{{- end }}
