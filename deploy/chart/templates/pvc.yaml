{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-state" .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    # Kept when the release is uninstalled: the whole point of this volume is
    # to remember what has already been reported, and helm delete is exactly
    # the moment you would rather not re-announce every failure in the cluster
    # on the next install.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    # ReadWriteOnce on purpose. SQLite over a shared filesystem corrupts, and
    # RWX here would advertise a multi-replica story the store cannot honour.
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}

{{- if and .Values.persistence.enabled .Values.ui.enabled (not .Values.ui.persistence.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-ui-state" .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ui
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    # Its OWN claim, not the controller's. Two processes writing one SQLite
    # file over a volume is the failure store.py describes, and mounting the
    # controller's claim here would be exactly that -- while looking tidier
    # than creating a second PVC, which is how it would get done.
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
