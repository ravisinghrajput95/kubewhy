{{- $name := default (printf "%s" .Release.Name) .Values.serviceAccount.name -}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
{{- if .Values.rbac.create }}
---
# Read-only by construction. The agent has no mutating tool, and this role
# makes that a property the API server enforces rather than a promise the
# code keeps.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-readonly
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "services", "events", "namespaces"]
    verbs: ["get", "list", "watch"]
{{- if .Values.rbac.allowPodLogs }}
  # Logs are where root causes live, and also where credentials live.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
{{- end }}
  # daemonsets and statefulsets are for the zero-pod scan (defect 48): a
  # workload whose pods were rejected at admission appears in no pod listing,
  # so scan_cluster has to find it on its controller or report the namespace
  # clean. An install whose role predates this grant loses those rows and
  # keeps every other finding -- _stalled_controllers swallows the 403.
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "daemonsets", "statefulsets"]
    verbs: ["get", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]

  # Jobs, for list_jobs. A Job is the one workload whose failure reason is on
  # no pod: DeadlineExceeded and BackoffLimitExceeded are recorded by the Job
  # controller on the Job's own conditions, and the pods are then deleted or
  # abandoned. Without this grant a scheduled workload that ran out of time is
  # unreadable, and a Job whose pods are gone is invisible entirely.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list"]

  # Reference targets for scan_references. All list-only, and all chosen
  # because a broken reference to one of them leaves every pod Running and
  # Ready -- which is exactly what nothing else here can see.
  #
  # Secrets are deliberately absent and stay absent. A pod's reference TO a
  # Secret is in the pod spec and is already readable; verifying the Secret
  # exists would mean listing Secrets, and a list returns their data. The
  # reference is worth reporting; the contents are not worth the grant.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]

  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list"]

  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list"]

  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list"]

  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-readonly
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}-readonly
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
