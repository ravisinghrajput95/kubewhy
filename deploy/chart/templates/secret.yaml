{{- if and (eq .Values.sink.type "slack") (not .Values.sink.slack.existingSecret) }}
{{- if not .Values.sink.slack.webhookUrl }}
{{- fail "sink.type is slack: set sink.slack.existingSecret (preferred), or sink.slack.webhookUrl. For a bot token, put it in existingSecret under botTokenKey and set sink.slack.channel." }}
{{- end }}
# Created only when no existingSecret is supplied. Doing it this way puts the
# webhook in your values file and your release history -- fine for a trial,
# not for anything you would mind someone else posting to.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-slack
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
type: Opaque
stringData:
  {{ .Values.sink.slack.secretKey }}: {{ .Values.sink.slack.webhookUrl | quote }}
{{- end }}
{{- if or (and .Values.inference.apiKey.value (not .Values.inference.apiKey.existingSecret)) (and .Values.inference.fallback.apiKey.value (not .Values.inference.fallback.apiKey.existingSecret)) }}
---
# Created only when a key is given inline and no existingSecret is supplied.
# Doing it this way puts the credential in your values file and your release
# history, which is fine for a trial and not for anything you would mind
# someone else spending.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-inference
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
type: Opaque
stringData:
  {{- if .Values.inference.apiKey.value }}
  {{ .Values.inference.apiKey.key }}: {{ .Values.inference.apiKey.value | quote }}
  {{- end }}
  {{- if .Values.inference.fallback.apiKey.value }}
  {{ .Values.inference.fallback.apiKey.key }}: {{ .Values.inference.fallback.apiKey.value | quote }}
  {{- end }}
{{- end }}
