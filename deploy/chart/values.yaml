image:
  # Published by .github/workflows/release.yml on every v* tag, multi-arch so
  # it runs on amd64 clusters as well as arm64 laptops.
  repository: ghcr.io/ravisinghrajput95/kubewhy
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

# Where diagnoses go. "stdout" is the safe default: it proves the controller
# works before you point it at a channel people read.
sink:
  type: stdout       # stdout | slack
  slack:
    # Prefer existingSecret. A webhook URL is a credential -- anyone holding
    # it can post to your channel -- and putting it here puts it in your
    # values file, your shell history and probably a git repo.
    existingSecret: ""
    secretKey: webhook-url
    webhookUrl: ""

    # A bot token posts via chat.postMessage instead, and is preferred when
    # both are set: a webhook is nailed to the channel it was created for,
    # while a token can post anywhere the bot is invited. Needs a channel.
    #
    # Put the token in existingSecret under botTokenKey. Never here: this file
    # ends up in your shell history and your release history.
    botTokenKey: bot-token
    channel: ""

# Where inference happens, and whether cluster evidence may leave to get there.
#
# The mode is not a label. inference.py checks it against the endpoint and
# refuses to start when the two disagree -- so `mode: cluster` pointed at a
# vendor fails the pod rather than installing cleanly and shipping pod logs
# while every log line says the inference was in-cluster. The chart makes the
# same check at template time, because a `helm install` that fails with an
# explanation is better than one that succeeds into a CrashLoopBackOff.
inference:
  # local   -- a model outside the cluster, typically a workstation. Set
  #            endpoint to something the pod can actually reach; a container's
  #            localhost is its own.
  # cluster -- a model inside the cluster, reached by Service DNS. The default,
  #            because that is what deploying this chart means.
  # api     -- a hosted API. Requires allowExternal below, and means cluster
  #            evidence leaves your network.
  mode: cluster

  # ollama | vllm | openai. Empty picks the default for the mode: ollama for
  # local and cluster, openai for api.
  provider: ""

  # Empty uses model.ollamaHost below for the ollama provider, and the
  # provider's own default otherwise. Set this directly to point a vLLM or an
  # OpenAI-compatible gateway somewhere specific.
  endpoint: ""

  # Empty uses model.name.
  model: ""

  # The switch that lets cluster evidence leave your network. Nothing else
  # turns it on: an api-mode install without this fails at template time, and
  # would fail again at startup if it somehow got past.
  #
  # Pod logs are the input this agent depends on and the payload it holds.
  # Sending them to a vendor is a decision, so it is made here and nowhere
  # implicit.
  allowExternal: false

  # A second redaction pass at the network boundary, on top of the one the
  # collectors already do. Only ever runs on a request that is leaving.
  redactOnEgress: true

  # Credentials for a hosted provider. Prefer existingSecret: `value` puts the
  # key in your values file, your shell history and your release history.
  apiKey:
    existingSecret: ""
    key: api-key
    value: ""

  # Optional fallback, used only when the primary cannot be reached -- never
  # when it refuses. A 400 or a 401 fails identically elsewhere, and quietly
  # succeeding on the fallback would hide a configuration error.
  #
  # A fallback that leaves your network needs allowExternal above, exactly as
  # the primary does. The fallback is not a way around the policy.
  fallback:
    enabled: false
    mode: api
    provider: ""
    endpoint: ""
    # Required when enabled: a different provider serves a different
    # catalogue, and inheriting "qwen3" is a 404 at the moment the primary is
    # already down.
    model: ""
    apiKey:
      existingSecret: ""
      key: fallback-api-key
      value: ""

model:
  # The controller does not run a model. Point this at an Ollama reachable
  # from the cluster: a node with a GPU, a sidecar, or a host address --
  # or set ollama.enabled below and let this chart run one.
  #
  # Still the endpoint for the ollama provider when inference.endpoint is
  # empty, so an existing values file keeps working unchanged.
  ollamaHost: http://ollama.ollama.svc.cluster.local:11434
  name: qwen3
  timeoutSeconds: 300

# An in-cluster Ollama, off by default.
#
# Off because most clusters running a local model already have one -- on a GPU
# node, behind a gateway, shared between teams -- and standing up a second copy
# silently wastes a node's worth of memory. Turning this on is a decision to
# let the chart own the model server too; when you do, point model.ollamaHost
# at it: http://<name>.<namespace>.svc.cluster.local:11434
#
# Validated on GKE 2026-08-22 serving llama3.2 to a real diagnosis.
ollama:
  enabled: false
  name: ollama
  # Defaults to the release namespace. The stock model.ollamaHost above
  # assumes a namespace literally called "ollama", so set both or neither.
  namespace: ""
  port: 11434
  image:
    repository: ollama/ollama
    tag: latest
    pullPolicy: IfNotPresent
  # Long, for the reason CONTRIBUTING gives: Ollama unloads five minutes after
  # the last request by default, and a controller that diagnoses twice an hour
  # would pay the load cost every single time.
  keepAlive: 24h
  # Pull the model named above when the container starts. Convenient, and it
  # makes the first readiness window long -- a 5GB pull on a cold node is
  # minutes, and the liveness probe above is tuned to survive it.
  pullModelOnStart: true
  # Sized for a ~2GB model on CPU. qwen3 at 5.2GB needs roughly 8Gi of request
  # and a good deal more CPU to be usable; a GPU node wants the vendor's
  # device plugin and a resource limit naming the GPU instead.
  resources:
    requests:
      cpu: "1"
      memory: 3Gi
    limits:
      cpu: "3500m"
      memory: 10Gi
  # Keep the weights across restarts. emptyDir re-pulls the model whenever the
  # pod moves, which is cheap for a test and expensive for 5GB in production.
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
  nodeSelector: {}
  tolerations: []

# An in-cluster vLLM, off by default.
#
# vLLM serves the OpenAI chat-completions protocol, which is why it needs no
# backend of its own -- `provider: vllm` is that protocol under a name that
# tells the telemetry the truth about where the request went.
#
# **Untested.** Nothing in this project has run against a real vLLM server.
# The manifest renders and validates; that is a statement about the manifest.
# The GPU path in particular is unverified, because the account this was built
# on cannot provision an accelerator at all.
vllm:
  enabled: false
  name: vllm
  namespace: ""
  port: 8000
  image:
    repository: vllm/vllm-openai
    tag: latest
    pullPolicy: IfNotPresent
  # The served model name. This is what inference.model must be set to: vLLM
  # answers to the name it was started with, and a mismatch is a 404 on every
  # request.
  model: Qwen/Qwen2.5-7B-Instruct
  extraArgs: []
  # GPU is optional here and the chart does not assume one. Leave gpuCount at 0
  # and vLLM runs on CPU, which is slow enough to be a demo rather than a
  # deployment -- measured on Ollama, an eight-core CPU node needed ~128s per
  # diagnosis with thinking off and timed out entirely with it on.
  gpuCount: 0
  gpuResource: nvidia.com/gpu
  resources:
    requests:
      cpu: "2"
      memory: 8Gi
    limits:
      memory: 24Gi
  persistence:
    enabled: true
    size: 40Gi
    storageClass: ""
  nodeSelector: {}
  tolerations: []

# Egress restriction, enforced by the cluster rather than promised by the code.
#
# Off by default for two honest reasons: it requires a CNI that actually
# enforces NetworkPolicy (many managed clusters ship one that does not, unless
# a dataplane option was chosen at creation), and this chart's version has been
# rendered and schema-checked but never enforcement-tested on a live cluster.
#
# When on, it permits DNS and traffic to private address space, and denies the
# public internet -- which makes "evidence does not leave your network" a
# property the dataplane enforces. It is refused outright with api mode, since
# the two say opposite things.
networkPolicy:
  enabled: false
  # Additional CIDRs to permit, for an inference endpoint that is off-cluster
  # but on your network in a range not covered by RFC1918.
  extraAllowedCIDRs: []

watch:
  # Empty means all namespaces. Narrow this in a large cluster: every pod
  # event is delivered to the controller regardless of what it acts on.
  namespaces: []
  # Per-workload silence after a finding. Thirty minutes is deliberately long
  # -- a crashlooping pod is still crashlooping a minute later, and repeating
  # yourself is how a bot gets muted.
  cooldownSeconds: 1800
  # Hard ceiling across all workloads. During a node failure dozens of pods
  # break at once and none of those messages help.
  maxPerHour: 12
  # Pods already broken at startup are usually known problems.
  skipExisting: true
  # How long ContainerCreating or PodInitializing has to last before it counts
  # as a fault rather than a start-up. Both are transient almost always, so
  # they cannot simply be watched -- every image pull passes through them --
  # but a volume naming a ConfigMap or Secret that does not exist parks a pod
  # in ContainerCreating forever, and nothing but elapsed time tells the two
  # apart. Raise it if you pull large images over a slow link; that is the
  # case this must not fire on.
  stuckAfterSeconds: 300

# Where the controller writes what it has already reported.
#
# Off by default, and the default is a real choice rather than caution: with
# this unset the controller keeps its dedup state in memory, so a restart
# forgets everything and the next rollout re-announces every failure in the
# cluster -- the exact noise the cooldown exists to prevent. store.py has
# supported a SQLite file from the start and the chart never set
# TRIAGE_STATE_DB, so the feature was unreachable in the shipped deployment.
#
# Not enabled by default because it claims a PersistentVolume, and a chart
# that silently provisions storage on install is a worse surprise than a
# controller that forgets. Turn it on for anything long-lived.
persistence:
  enabled: false
  # ReadWriteOnce, and one replica. SQLite over a shared filesystem corrupts;
  # see store.py for why this is the seam where Redis or Postgres would go.
  size: 128Mi
  # Empty uses the cluster default StorageClass.
  storageClass: ""
  # Bring your own claim instead, if you manage volumes separately.
  existingClaim: ""
  mountPath: /var/lib/kubewhy

# The browser UI. Off by default, and not merely as a default: it has no
# authentication at all, so switching it on is a decision about who can see
# your cluster rather than a convenience.
ui:
  enabled: false
  # Deliberate friction, and the only way past it other than auth.enabled
  # below. enabled alone renders nothing and fails the install with an
  # explanation, so nobody turns this on without reading what it means.
  exposureAcknowledged: false
  replicas: 1
  port: 8501

  # An authenticating reverse proxy in front of the console.
  #
  # This is what makes the console safe to put on a Service, and it is
  # structural rather than a check the app performs: with auth.enabled the
  # Streamlit process binds 127.0.0.1 and the Service targets the proxy, so
  # nothing unauthenticated can reach the app at all. Streamlit has no route
  # layer to hang an authenticator on, so an in-app check would run after the
  # connection was already accepted -- see identity.py.
  #
  # The app still refuses a request carrying no identity header
  # (TRIAGE_AUTH_MODE=proxy, set for you below). Two independent controls,
  # because the one that saves you is the one nobody remembered to check.
  #
  # Authorization is NOT per-user and this does not make it so. kubewhy is
  # built for one team against one cluster: everyone who signs in sees
  # everything the ServiceAccount can read, and the ClusterRole is where that
  # is narrowed. Restrict who may sign in with emailDomains or an
  # --allowed-group in extraArgs; do not expect namespace isolation.
  auth:
    enabled: false
    image:
      repository: quay.io/oauth2-proxy/oauth2-proxy
      tag: v7.7.1
      pullPolicy: IfNotPresent
    # The port the Service targets. The console's own port becomes internal
    # to the pod once this is on.
    port: 4180

    # Your identity provider. issuerUrl is the OIDC discovery root -- the host
    # serving /.well-known/openid-configuration.
    issuerUrl: ""
    clientID: ""

    # externalUrl is what the browser reaches the console on, and oauth2-proxy
    # builds its redirect URI from it. Getting it wrong produces a login loop
    # rather than an error, so it has no default. With a port-forward this is
    # http://localhost:<local port>.
    externalUrl: ""

    # Who may sign in. ["*"] accepts any address the provider issues, which is
    # only what you want if the provider itself is the boundary.
    emailDomains: ["*"]

    # A Secret holding `client-secret` and `cookie-secret`. Required: neither
    # belongs in a values file. cookie-secret must be 16, 24 or 32 bytes --
    #   kubectl create secret generic kubewhy-auth \
    #     --from-literal=client-secret=... \
    #     --from-literal=cookie-secret=$(openssl rand -base64 32 | head -c 32)
    existingSecret: ""

    # Anything else oauth2-proxy takes -- --allowed-group, --scope,
    # --provider for a non-generic provider, --cookie-secure=false behind a
    # plain-HTTP port-forward.
    extraArgs: []

    # NOTE, and it is a real collision rather than a caveat: networkPolicy
    # below selects this pod too, and permits egress only to private address
    # space. A provider on your network is reachable; a SaaS one -- Okta,
    # Entra, Google -- is not, and the symptom is the proxy failing OIDC
    # discovery at startup with nothing pointing at a NetworkPolicy.
    # networkPolicy.extraAllowedCIDRs is the escape hatch and a poor one for a
    # provider behind a CDN. Pick one of the two for now.

    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
  # A separate image: the base one has no streamlit in it, deliberately, so
  # the API and controller do not carry pandas and pyarrow. Built as the "ui"
  # target of the Dockerfile and published alongside the base image.
  image:
    repository: ""     # defaults to image.repository
    tag: ""            # defaults to "<image tag>-ui"
  # These are requests, so they are a scheduling constraint rather than a cap
  # -- the limit below is what actually bounds Streamlit. On a small managed
  # node they are the whole story: a 2-vCPU/2GB GKE e2-small has roughly 940m
  # and 1.36Gi allocatable, of which GKE's own system pods take ~750m and
  # ~900Mi, so this pod does not fit on one and sits Pending with
  # "Insufficient cpu, Insufficient memory". Give the UI a node with headroom,
  # or lower these two values -- not the limit.
  resources:
    requests:
      cpu: 100m
      # Streamlit pulls numpy, pandas and pyarrow, which is why it is not in
      # the base requirements and why this asks for more than the controller.
      memory: 512Mi
    limits:
      memory: 1Gi

rbac:
  create: true
  # pods/log is the sensitive grant: logs carry credentials. Redaction runs
  # first, but it is pattern matching. Set false to diagnose without logs.
  allowPodLogs: true

serviceAccount:
  create: true
  name: ""

logFormat: json
logLevel: INFO

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

# Read-only root, no privilege escalation, non-root user. The controller only
# needs outbound HTTP to the API server and to Ollama.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  # A provisioned PersistentVolume arrives owned by root, and this container
  # is not root -- so without fsGroup the controller starts, opens the state
  # path and dies with "unable to open database file". The kubelet chgrps the
  # volume to fsGroup and sets setgid on it before the container starts, which
  # is the only reason UID 1000 can write there. It has to match runAsUser's
  # group. With persistence off it applies to the tmp emptyDir instead, where
  # it changes nothing.
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
