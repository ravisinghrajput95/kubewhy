# Least-privilege credentials for kubewhy.
#
# The agent only ever reads. This ClusterRole enforces that at the API server
# rather than trusting the code, so a future tool that tries to mutate gets a
# 403 instead of succeeding. Grant this instead of pointing the agent at your
# own admin kubeconfig.
#
#   kubectl apply -f deploy/rbac.yaml
#   kubectl create token kubewhy-agent -n kubewhy --duration=8h
#
# Then build a kubeconfig from that token, or run the agent in-cluster with
# this ServiceAccount and it will pick the credentials up automatically.
#
# NOTE ON pods/log: this is the one genuinely sensitive grant here. Logs can
# contain credentials and personal data. The agent redacts common secret
# shapes before anything reaches the model, but redaction is best-effort --
# drop this rule if your logs are sensitive and you would rather diagnose
# without them.
---
apiVersion: v1
kind: Namespace
metadata:
  name: kubewhy
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubewhy-agent
  namespace: kubewhy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubewhy-agent-readonly
rules:
  # Pods, nodes, services and events. No create/update/patch/delete anywhere.
  - apiGroups: [""]
    resources: ["pods", "nodes", "services", "events", "namespaces"]
    # watch is required by controller.py, which streams pod events rather
    # than polling. Without it the interactive agent works fine and the
    # controller 403s on its very first watch -- a split that went unnoticed
    # until this was applied to a real cluster, because the Helm chart's copy
    # of these rules already had it.
    verbs: ["get", "list", "watch"]

  # Container logs -- see the note above.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

  # Deployments, for degraded-workload detection.
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list"]

  # EndpointSlices, for service-reachability diagnosis.
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]

  # Reference targets for scan_references. All list-only, and all chosen
  # because a broken reference to one of them leaves every pod Running and
  # Ready -- which is exactly what nothing else here can see.
  #
  # Secrets are deliberately absent and stay absent. A pod's reference TO a
  # Secret is in the pod spec and is already readable; verifying the Secret
  # exists would mean listing Secrets, and a list returns their data. The
  # reference is worth reporting; the contents are not worth the grant.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]

  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list"]

  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list"]

  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list"]

  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubewhy-agent-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubewhy-agent-readonly
subjects:
  - kind: ServiceAccount
    name: kubewhy-agent
    namespace: kubewhy
