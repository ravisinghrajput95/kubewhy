apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-api
  namespace: uncovered2
  labels: {app: billing-api}
spec:
  replicas: 1
  selector: {matchLabels: {app: billing-api}}
  template:
    metadata: {labels: {app: billing-api}}
    spec:
      containers:
        - name: app
          image: billing-api:3.2.1
          imagePullPolicy: Never
